[package]
name = "robo-croissant-pipeline"
version = "0.1.0"
edition = "2024"

#[lib]
#path = "src/lib.rs"

[dependencies]
clap = { version = "^4.6", features = ["derive"] }
csv = "^1.4"
chrono = "0.4"
env_logger = "^0.11"
flate2 = "1"
log = "^0.4"
noodles = { version = "^0.116", features = ["bam", "bcf", "sam", "vcf"] }
polars = { version = "^0.55", features = ["avro", "default", "ipc", "parquet"]}
regex = "1.12.2"
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
tokio = { version = "1.52.3", features = ["rt", "rt-multi-thread", "macros"] }
